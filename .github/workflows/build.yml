name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # El repo no incluye gradlew, así que se instala Gradle 8.13
      # (la misma versión de gradle-wrapper.properties).
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Build debug + release (unsigned) APKs
        run: gradle assembleDebug assembleRelease --stacktrace

      - name: Lint
        run: gradle lintDebug --stacktrace
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: DroidLens-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: DroidLens-release-unsigned-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  release:
    # Al empujar un tag tipo v1.0.0 se publica el APK debug en GitHub Releases.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DroidLens-debug-apk
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
